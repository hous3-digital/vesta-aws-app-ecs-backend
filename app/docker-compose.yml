# Vesta local infra: Postgres and Redis only. The API runs outside the containers (yarn start:local).
# Usage: make up / make down (repo root) or docker compose up -d here.
services:
  postgres:
    image: postgres:16-alpine
    container_name: vesta-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vesta_local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vesta-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vesta_local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vesta-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vesta-postgres-data:
