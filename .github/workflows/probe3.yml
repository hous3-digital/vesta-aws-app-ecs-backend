name: probe3-secret-in-env
on:
  push:
    branches:
      - staging
jobs:
  env-arn:
    runs-on: ubuntu-latest
    steps:
      - name: Secret inside an env value
        env:
          PRIVY_APP_ID_SECRET_ID: "arn:aws:secretsmanager:us-east-1:${{ secrets.AWS_ACCOUNT_ID_STAGING }}:secret:PRIVY_APP_ID-Q3bsf0"
        run: |
          echo "::add-mask::${PRIVY_APP_ID_SECRET_ID}"
          echo "length ${#PRIVY_APP_ID_SECRET_ID}"
