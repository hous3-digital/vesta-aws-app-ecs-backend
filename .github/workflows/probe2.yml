name: probe2-local-action
on:
  push:
    branches:
      - staging
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render tfvars with values kept outside the repository
        uses: ./.github/actions/render-tfvars
        with:
          env: staging
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID_STAGING }}
          client-origins: ${{ vars.CLIENT_WEBAUTHN_ORIGINS_STAGING }}
          client-rp-ids: ${{ vars.CLIENT_WEBAUTHN_RP_IDS_STAGING }}
      - run: grep -c "__" infra/terraform/envs/staging/variables.tfvars || echo "no placeholder left"
